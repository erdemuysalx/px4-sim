name: Publish images

# Builds both images natively on amd64 and arm64 runners, labels them with the
# exact ROS 2 / Gazebo / PX4 versions inside, and publishes multi-arch tags:
#   erdemuysalx/ros2-gazebo:  jazzy-harmonic, jazzy-harmonic-<YYYYMMDD>
#   erdemuysalx/px4-sim:      latest, px4-<version>, px4-<version>-<YYYYMMDD>
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Must match BASE_IMAGE / PX4_IMAGE in build.sh
  BASE_REPO: erdemuysalx/ros2-gazebo
  BASE_TAG: jazzy-harmonic
  PX4_REPO: erdemuysalx/px4-sim

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Hosted runners ship with ~20 GB free; the two images need more
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Plain docker build (not buildx) so px4.Dockerfile's FROM finds the freshly built local base image
      - name: Build images
        run: ./build.sh --all

      - name: Add version labels
        run: .github/scripts/add_version_labels.sh "$BASE_REPO:$BASE_TAG" "$PX4_REPO:latest"

      # Per-arch staging tags, combined into multi-arch tags by the manifest job
      - name: Push arch-specific tags
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "$BASE_REPO:$BASE_TAG" "$BASE_REPO:$BASE_TAG-$ARCH"
          docker tag "$PX4_REPO:latest" "$PX4_REPO:latest-$ARCH"
          docker push "$BASE_REPO:$BASE_TAG-$ARCH"
          docker push "$PX4_REPO:latest-$ARCH"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch tags
        run: |
          date="$(date -u +%Y%m%d)"
          px4_version="$(sed -n 's/^ARG PX4_VERSION=//p' px4.Dockerfile)"

          docker buildx imagetools create \
            -t "$BASE_REPO:$BASE_TAG" \
            -t "$BASE_REPO:$BASE_TAG-$date" \
            "$BASE_REPO:$BASE_TAG-amd64" "$BASE_REPO:$BASE_TAG-arm64"

          docker buildx imagetools create \
            -t "$PX4_REPO:latest" \
            -t "$PX4_REPO:px4-$px4_version" \
            -t "$PX4_REPO:px4-$px4_version-$date" \
            "$PX4_REPO:latest-amd64" "$PX4_REPO:latest-arm64"
