[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; -cleanstale removes X11 locks left by a VNC server that died with the previous container run
[program:vncserver]
command=/usr/bin/vncserver :1 -geometry 1920x1080 -depth 24 -localhost no -cleanstale -fg
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/vncserver.log
stderr_logfile=/var/log/supervisor/vncserver_error.log

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 6080
autorestart=true
priority=200
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_error.log

; MAVROS + ros_gz_bridge; both wait for PX4/Gazebo, which the user starts manually to keep the pxh> console
[program:ros-bridges]
command=/bin/bash -c "source /opt/ros/jazzy/setup.bash && exec ros2 launch /opt/px4-sim/launch/bridges.launch.py"
autostart=%(ENV_ROS_BRIDGES_AUTOSTART)s
autorestart=true
startsecs=5
priority=300
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
